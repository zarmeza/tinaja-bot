# Settings for tinaja-bot. The token is not here: put DISCORD_BOT_TOKEN in .env (see env.sample).
name = "tinaja-bot"
prefix = "!"
context_file = "CONTEXT.md" # the lexicon, answered by !glossary [term]

[intents]
message_content = true # read message text: needed for prefix commands and for reading the channel
members = false
presences = false

[replies]
# Plain-text commands, no code needed. {author} mentions whoever asked, {prefix} is the prefix above.
ping = "pong {author}"
# Reserved: the answer to an unknown Command. {command} is what they typed after the prefix.
fallback = "Discúlpeme, {author}, no reconozco {prefix}{command}. Pruebe con {prefix}help"

[mentions]
as_prefix = true # "@Bot hola" works the same as "!hola"; also needed for on_mention in the plugin

[plugins.main]
# The Ruby code of the bot: its Commands and listeners. See plugin/bot.rb
cwd = "plugin"
run = "bundle exec ruby bot.rb"
